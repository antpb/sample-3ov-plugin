name: Publish Plugin

on:
  release:
    types: [published]

env:
  API_KEY: ${{ secrets.API_KEY }}
  EMAIL: ${{ secrets.EMAIL }}
  PASSWORD: ${{ secrets.PASSWORD }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install dependencies
      run: npm install axios

    - name: Publish plugin
      run: |
        node .github/scripts/publish-plugin.js
      env:
        PLUGIN_NAME: ${{ github.event.release.tag_name }}
        ZIP_FILE: ${{ github.event.release.tag_name }}.zip
        JSON_FILE: plugin-metadata.json
        ASSETS_DIR: assets
        AUTHOR_INFO: author-info.json